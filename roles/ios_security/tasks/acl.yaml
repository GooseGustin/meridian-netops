---
- name: Configure ACLs from policy data
  cisco.ios.ios_config:
    lines: >
      {{ item.1.sequence }} {{ item.1.action }}
      {{ item.1.source | default('') }}
      {{ item.1.destination | default('') }}
      {{ 'log' if item.1.log | default(false) else '' }}
    parents: "ip access-list {{ item.0.type }} {{ item.0.name }}"
  loop: "{{ ios_security_acl_policy | subelements('rules') }}"
  loop_control:
    label: "{{ item.0.name }} rule {{ item.1.sequence }}"

- name: Apply MGMT-ACCESS to VTY lines
  cisco.ios.ios_config:
    lines:
      - access-class MGMT-ACCESS in
    parents: line vty 0 4

- name: Block attacker R5 SSH traffic
  cisco.ios.ios_config:
    lines:
      - 5 deny tcp host 10.0.34.5 any eq 22 log
    parents: ip access-list extended INBOUND-POLICY

- name: Block Operations to Finance MySQL
  cisco.ios.ios_config:
    lines:
      - 10 deny tcp 10.2.0.0 0.0.0.255 10.1.0.0 0.0.0.255 eq 3306 log
      - 20 permit ip 10.2.0.0 0.0.0.255 any
    parents: ip access-list extended 102

- name: Apply Operations ACL to VLAN 20 subinterface
  cisco.ios.ios_config:
    lines:
      - ip access-group 102 in
    parents: interface FastEthernet1/0.20
