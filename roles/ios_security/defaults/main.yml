---
ios_security_acl_policy:
  - name: MGMT-ACCESS
    type: standard
    rules:
      - sequence: 10
        action: permit
        source: 192.168.100.0 0.0.0.255
      - sequence: 20
        action: deny
        source: any
        log: true

  - name: INBOUND-POLICY
    type: extended
    rules:
      - sequence: 10
        action: deny
        source: 10.0.0.0 0.255.255.255
        destination: any
        log: true
      - sequence: 20
        action: deny
        source: 172.16.0.0 0.0.255.255
        destination: any
        log: true
      - sequence: 30
        action: permit
        protocol: tcp
        source: any
        destination: host 203.0.113.1
        dest_port: eq 22
      - sequence: 40
        action: deny
        source: any
        destination: any
        log: true
