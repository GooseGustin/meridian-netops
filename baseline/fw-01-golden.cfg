
! MERIDIAN FINANCIAL GROUP — Golden Config for fw-01
! Generated: 2024-03-15 (post-incident remediation)
!
version 15.2
service password-encryption
service timestamps log datetime msec
!
hostname fw-01
!
ip domain name meridian.internal
ip ssh version 2
!
interface GigabitEthernet0/0
 description ** Uplink to edge-router-01 **
 ip address 10.0.1.2 255.255.255.0
 ip access-group OUTSIDE_IN in
 no shutdown
!
interface GigabitEthernet0/1
 description ** Link to core-sw-01 **
 ip address 10.0.2.1 255.255.255.0
 no shutdown
!
ip access-list extended OUTSIDE_IN
 permit tcp any host 10.0.10.5 eq 443
 permit tcp any host 10.0.10.5 eq 80
 deny ip any any log
!
ip access-list extended INSIDE_OUT
 permit ip 10.0.10.0 0.0.0.255 any
 permit ip 10.0.20.0 0.0.0.255 any
 deny ip any any log
!
logging buffered 16384 debugging
logging host 10.50.0.100
ntp server 10.0.0.1
!
line vty 0 4
 login local
 transport input ssh
!
end
