running_config: |
  !
  version 15.2
  service password-encryption
  service timestamps log datetime msec
  !
  hostname edge-router-01
  !
  enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
  !
  ip domain name meridian.internal
  ip name-server 10.0.0.254
  no ip source-route
  !
  interface GigabitEthernet0/0
   description ** Uplink to ISP **
   ip address 10.0.0.1 255.255.255.0
   ip access-group INBOUND_FILTER in
   no shutdown
  !
  interface GigabitEthernet0/1
   description ** Link to fw-01 **
   ip address 10.0.1.1 255.255.255.0
   no shutdown
  !
  interface GigabitEthernet0/2
   description ** UNUSED - DO NOT ENABLE **
   shutdown
  !
  ip access-list extended MANAGEMENT_ACCESS
   permit tcp 10.50.0.0 0.0.255.255 any eq 22
   permit tcp 10.50.0.0 0.0.255.255 any eq 443
   deny ip any any log
  !
  ip access-list extended INBOUND_FILTER
   permit tcp any host 10.0.10.5 eq 443
   permit tcp any host 10.0.10.5 eq 80
   deny ip any any log
  !
  logging buffered 16384 debugging
  logging host 10.50.0.100
  ntp server 10.0.0.254
  !
  line vty 0 4
   access-class MANAGEMENT_ACCESS in
   login local
   transport input ssh
  !
  end
