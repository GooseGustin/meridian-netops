# .github/workflows/network-ci.yml
name: Meridian Network CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Notify pipeline start
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-type: application/json" \
            -d "{
              \"text\": \"🚀 Pipeline started by ${{ github.actor }} on \`${{ github.ref_name }}\`\",
              \"attachments\": [{
                \"color\": \"#36a64f\",
                \"text\": \"Run: ${{ github.run_url }}\"
              }]
            }"

      - name: Install tools
        run: |
          pip install --quiet yamllint ansible ansible-lint
          ansible-galaxy collection install cisco.ios > /dev/null 2>&1

      - name: Lint YAML
        run: yamllint -c .yamllint.yaml inventory/ roles/ playbooks/

      - name: Lint Ansible
        run: ansible-lint playbooks/deploy.yaml

  dry-run:
    name: Dry Run
    runs-on: self-hosted
    needs: lint
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write vault password
        run: echo "${{ secrets.VAULT_PASSWORD }}" > /tmp/.vault_pass

      - name: Ansible dry run
        run: |
          ansible-playbook playbooks/deploy.yaml \
            --inventory inventory/hosts.yaml \
            --vault-password-file /tmp/.vault_pass \
            --check \
            --diff \
            --limit 'all:!R8'

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/.vault_pass

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: dry-run
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write vault password
        run: echo "${{ secrets.VAULT_PASSWORD }}" > /tmp/.vault_pass

      - name: Deploy to lab
        run: |
          ansible-playbook playbooks/deploy.yaml \
            --inventory inventory/hosts.yaml \
            --vault-password-file /tmp/.vault_pass \
            --diff

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/.vault_pass

  test:
    name: Test
    runs-on: self-hosted
    needs: deploy
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pyATS
        run: pip install --quiet pyats genie

      - name: Run pyATS tests
        run: |
          python tests/test_meridian.py \
            --testbed tests/testbed.yaml

      - name: Notify pipeline result
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="good"
          EMOJI="✅"
          if [ "$STATUS" != "success" ]; then
            COLOR="danger"
            EMOJI="❌"
          fi
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-type: application/json" \
            -d "{
              \"text\": \"$EMOJI Pipeline $STATUS on \`${{ github.ref_name }}\` (by ${{ github.actor }})\",
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"text\": \"Run: ${{ github.run_url }}\"
              }]
            }"
