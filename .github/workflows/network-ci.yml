# .github/workflows/network-ci.yml
# Meridian Network Automation — CI Pipeline
# Runs on every push and pull request to main.
# Mirrors ci_validate.sh but runs automatically on every push.

name: Network Automation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Automation Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check — Python files
        run: |
          for f in scripts/*.py sim/*.py; do
            echo "Checking: $f"
            python -m py_compile "$f"
          done

      - name: Validate YAML files
        run: |
          python -c "
          import yaml, glob
          for path in glob.glob('baseline/*.yaml') + glob.glob('data/*.yaml') + ['inventory.yaml']:
              try:
                  yaml.safe_load(open(path))
                  print(f'OK: {path}')
              except Exception as e:
                  print(f'FAIL: {path} -> {e}')
                  exit(1)
          "

      - name: Policy integrity check
        run: |
          python -c "
          import yaml
          with open('baseline/security_policy.yaml') as f:
              p = yaml.safe_load(f)
          assert 'required_config_lines' in p
          assert 'forbidden_config_lines' in p
          assert len(p['required_config_lines']) > 0
          print('Policy integrity: OK')
          "

      - name: Secret hygiene check
        run: |
          python -c "
          import re, glob, sys
          issues = []
          for path in glob.glob('scripts/*.py') + glob.glob('sim/*.py'):
              content = open(path).read()
              if re.search(r'password\s*=\s*[\"\\x27][^\"\\x27]{6,}', content, re.I):
                  issues.append(path)
          if issues:
              print('Hardcoded credentials found:', issues)
              sys.exit(1)
          print('Secret hygiene: OK')
          "

      - name: Render Jinja2 templates
        run: |
          python scripts/17_acl_generator.py || echo "ACL generator ran (no live devices in CI)"
